server:
  port: 8000

spring:
  application:
    name: short-link-gateway
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

logging:
  level:
    root: INFO
    com.lanyue.shortlink.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
